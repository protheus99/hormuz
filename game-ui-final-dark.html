<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hormuz — Game UI Final (Dark Theme)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
      color: #d0d0e0;
      height: 100vh;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    /* GAME MAP (TOP, FILLS AVAILABLE SPACE) */
    .game-view {
      flex: 1;
      background: linear-gradient(135deg, #2a2a3e 0%, #1f1f33 100%);
      border-bottom: 1px solid #3d3d52;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 14px;
      overflow: hidden;
      min-height: 300px;
      transition: all 0.3s ease;
    }

    .game-view.hidden {
      display: none;
    }

    /* CONTENT PANEL (MIDDLE, SCROLLABLE) */
    .content-panel {
      height: 350px;
      background: #1a1a2e;
      border-top: 1px solid #2d2d42;
      border-bottom: 1px solid #2d2d42;
      overflow-y: auto;
      overflow-x: hidden;
      display: none;
      z-index: 50;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .content-panel.active {
      display: flex;
      flex-direction: column;
    }

    .content-panel.expanded {
      height: auto;
      flex: 1;
    }

    .panel-header {
      background: linear-gradient(135deg, #2a2a3e 0%, #1f1f33 100%);
      border-bottom: 1px solid #2d2d42;
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .panel-header h2 {
      font-size: 15px;
      font-weight: 700;
      color: #4fb3d9;
      letter-spacing: 0.5px;
    }

    .panel-content {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .close-btn {
      cursor: pointer;
      color: #888;
      font-size: 18px;
      font-weight: bold;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #4fb3d9;
    }

    .card {
      background: #232338;
      border: 1px solid #3d3d52;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .card:hover {
      border-color: #4fb3d9;
      background: #2d2d42;
      box-shadow: 0 2px 8px rgba(79, 179, 217, 0.2);
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .metric {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .metric-value {
      font-size: 16px;
      font-weight: 700;
      color: #4fb3d9;
    }

    .metric-value.positive {
      color: #4caf50;
    }

    .metric-value.negative {
      color: #ff6b6b;
    }

    .metric-value.warning {
      color: #ff9800;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 20px 0 12px 0;
      padding-left: 4px;
    }

    .progress-bar {
      background: #3d3d52;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4fb3d9 0%, #7fd4f0 100%);
      border-radius: 3px;
    }

    .progress-text {
      font-size: 11px;
      color: #888;
      display: flex;
      justify-content: space-between;
    }

    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .status-good {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
    }

    .status-warning {
      background: rgba(255, 152, 0, 0.2);
      color: #ff9800;
    }

    .alert-box {
      background: rgba(255, 107, 107, 0.15);
      border-left: 3px solid #ff6b6b;
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #ff9999;
    }

    .alert-box.warning {
      background: rgba(255, 152, 0, 0.15);
      border-left-color: #ff9800;
      color: #ffb347;
    }

    .list-item {
      background: #232338;
      border: 1px solid #3d3d52;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-item-title {
      font-weight: 600;
      color: #d0d0e0;
      font-size: 12px;
    }

    .list-item-detail {
      font-size: 11px;
      color: #888;
    }

    .list-item-value {
      font-weight: 600;
      color: #4fb3d9;
      font-size: 13px;
    }

    .btn-small {
      background: #4fb3d9;
      color: #0f0f1e;
      border: none;
      padding: 6px 12px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: all 0.2s;
    }

    .btn-small:hover {
      background: #3a95b8;
    }

    /* SCROLLBAR STYLING */
    .content-panel::-webkit-scrollbar {
      width: 8px;
    }

    .content-panel::-webkit-scrollbar-track {
      background: #2a2a3e;
    }

    .content-panel::-webkit-scrollbar-thumb {
      background: #3d3d52;
      border-radius: 4px;
    }

    .content-panel::-webkit-scrollbar-thumb:hover {
      background: #4fb3d9;
    }

    /* TOOLBAR (PINNED BOTTOM, NEVER SCROLLS) */
    .toolbar {
      background: #0f0f1e;
      border-top: 1px solid #2d2d42;
      border-bottom: 2px solid #4fb3d9;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.4);
      z-index: 100;
      min-height: 60px;
    }

    .toolbar-section {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar-section.status {
      margin-left: auto;
      gap: 15px;
    }

    .toolbar-icon {
      width: 44px;
      height: 44px;
      background: #232338;
      border: 1px solid #3d3d52;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
      position: relative;
      padding: 0;
      font-family: inherit;
      color: inherit;
    }

    .toolbar-icon:hover {
      background: #2d2d42;
      border-color: #4fb3d9;
      box-shadow: 0 0 10px rgba(79, 179, 217, 0.3);
    }

    .toolbar-icon.active {
      background: #4fb3d9;
      color: #0f0f1e;
      border-color: #4fb3d9;
    }

    .toolbar-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ff6b6b;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #0f0f1e;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 0 8px;
      border-right: 1px solid #2d2d42;
      font-size: 12px;
    }

    .status-item:last-child {
      border-right: none;
      padding-right: 0;
    }

    .status-label {
      font-size: 9px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .status-value {
      font-size: 13px;
      font-weight: 600;
      color: #4fb3d9;
    }

    .status-value.positive {
      color: #4caf50;
    }

    .speed-dial {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .speed-button {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #232338;
      border: 1px solid #3d3d52;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      color: #888;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speed-button:hover {
      border-color: #4fb3d9;
      color: #4fb3d9;
    }

    .speed-button.active {
      background: #4fb3d9;
      border-color: #4fb3d9;
      color: #0f0f1e;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .toolbar {
        padding: 10px 12px;
        min-height: 50px;
      }

      .toolbar-icon {
        width: 36px;
        height: 36px;
        font-size: 16px;
      }

      .status-item {
        padding: 0 4px;
        font-size: 10px;
      }

      .status-label {
        font-size: 8px;
      }

      .status-value {
        font-size: 11px;
      }

      .panel-content {
        padding: 16px;
      }

      .card {
        padding: 12px;
      }
    }
  </style>
</head>

          <button class="speed-button" onclick="setSpeed(this, '7x')" title="7× Speed">7×</button>

      </div>
    </div>
  </div>

            <div>
              <div class="list-item-title">Cash on Hand</div>
              <div class="list-item-detail">Immediate liquidity</div>
            </div>
            <div class="list-item-value">$12.4M</div>
          </div>
          <div class="section-title">Resources</div>
          <div class="list-item">
            <div>
              <div class="list-item-title">Total Production Capacity</div>
              <div class="list-item-detail">All operating concessions</div>
            </div>
            <div class="list-item-value">10,300 bbl/day</div>
          </div>
          <div class="list-item">
            <div>
              <div class="list-item-title">Credit Available</div>
              <div class="list-item-detail">Remaining credit line</div>
            </div>
            <div class="list-item-value">$18.6M</div>
          </div>
        </div>
      `
    };

    function openContent(type) {
      const panel = document.getElementById('contentPanel');
      const gameView = document.getElementById('gameView');
      
      panel.innerHTML = content[type];
      panel.classList.add('active');
      panel.classList.add('expanded');
      gameView.classList.add('hidden');
      
      // Update toolbar buttons
      document.querySelectorAll('.toolbar-icon').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    function goToMap() {
      const panel = document.getElementById('contentPanel');
      const gameView = document.getElementById('gameView');
      
      panel.classList.remove('active');
      panel.classList.remove('expanded');
      gameView.classList.remove('hidden');
      
      // Clear active states
      document.querySelectorAll('.toolbar-icon').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector('.toolbar-icon').classList.add('active');
    }

    function setSpeed(btn, speed) {
      document.querySelectorAll('.speed-button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // Start on map
    window.addEventListener('load', () => {
      document.querySelector('.toolbar-icon').classList.add('active');
    });
  </script>
</body>
</html>
